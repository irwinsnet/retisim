[project]
name = "retisim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stacy Irwin", email = "stacy.k.irwin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "research",
    "rich>=15.0.0",
    "simulator",
]

[tool.uv.sources]
research = { workspace = true }
simulator = { workspace = true}

[tool.uv.workspace]
members = ["packages/*"]

[project.scripts]
retisim = "retisim:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scipy>=1.18.1",
]
